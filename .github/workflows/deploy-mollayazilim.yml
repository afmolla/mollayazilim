# VPS otomatik deploy — SADECE elle veya Secrets doluysa
# Secrets: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH (C:/inetpub/wwwroot/mollyazilim)

name: Deploy mollayazilim.com

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets yoksa job atlanir (kirmizi X olmaz)
    if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_KEY != '' && secrets.DEPLOY_PATH != '' }}
    steps:
      - name: SSH deploy (Windows VPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ secrets.DEPLOY_PATH }}/deploy/sunucu-guncelle.ps1"
