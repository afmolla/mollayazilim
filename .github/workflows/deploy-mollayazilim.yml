# VPS deploy — SADECE ELLE calistir (push'ta mail/ hata yok)
# Secrets: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH = C:/inetpub/wwwroot/mollayazilim
# Otomatik push deploy icin Secrets ekledikten sonra asagidaki "push" satirinin yorumunu ac.

name: Deploy mollayazilim.com

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy-skip-notice:
    if: ${{ secrets.SSH_HOST == '' || secrets.SSH_USER == '' || secrets.SSH_KEY == '' || secrets.DEPLOY_PATH == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Secrets eksik
        run: |
          echo "Deploy atlandi: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH tanimli degil."
          echo "Repo Settings -> Secrets -> Actions"
          echo "Veya VPS'te: deploy\sunucu-guncelle.ps1"

  deploy:
    if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_KEY != '' && secrets.DEPLOY_PATH != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (Windows VPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ secrets.DEPLOY_PATH }}/deploy/sunucu-guncelle.ps1"
