# VPS deploy — elle: Actions -> Deploy mollayazilim.com -> Run workflow
# Secrets: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH = C:/inetpub/wwwroot/mollayazilim
# Otomatik push deploy: Secrets ekledikten sonra asagidaki push: yorumunu ac.

name: Deploy mollayazilim.com

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Secrets eksik (deploy atlandi)
        if: ${{ secrets.SSH_HOST == '' || secrets.SSH_USER == '' || secrets.SSH_KEY == '' || secrets.DEPLOY_PATH == '' }}
        run: |
          echo "::notice::Deploy atlandi — SSH secrets tanimli degil."
          echo "Repo Settings -> Secrets -> Actions: SSH_HOST, SSH_USER, SSH_KEY, DEPLOY_PATH"
          echo "VPS elle: deploy\sunucu-guncelle.ps1"

      - name: SSH deploy (Windows VPS)
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_KEY != '' && secrets.DEPLOY_PATH != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "${{ secrets.DEPLOY_PATH }}/deploy/sunucu-guncelle.ps1"
