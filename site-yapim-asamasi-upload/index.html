<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Mollayazilim — Sayfa yapım aşamasında" />
    <title>Yapım aşamasında — Mollayazilim</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0b0b0e;
        color: #e4e4e7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.5;
      }
      .box {
        max-width: 26rem;
        text-align: center;
        padding: 2.5rem 1.75rem;
        border-radius: 1rem;
        background: #18181b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      .tag {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #a78bfa;
        background: rgba(167, 139, 250, 0.12);
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #a78bfa;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        color: #a1a1aa;
      }
      .line {
        margin-top: 1.75rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 0.8rem;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="tag">Yapım aşamasında</div>
      <h1><span>Mollayazilim</span> — Yakında</h1>
      <p>Sitemiz hazırlanıyor. En kısa sürede burada olacağız.</p>
      <p class="line" id="y">© Mollayazilim</p>
    </main>
    <script>
      document.getElementById("y").textContent = "© " + new Date().getFullYear() + " Mollayazilim";
    </script>
  </body>
</html>
